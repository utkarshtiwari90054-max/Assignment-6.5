<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="profile-card">
      <span class="profile-card__badge">Open to work</span>

      <img class="profile-card__image" src="images/avatar.svg" alt="Avatar of Riya Sharma">

      <div class="profile-card__body">
        <h1 class="profile-card__name">Riya Sharma</h1>
        <p class="profile-card__role">Front-end developer</p>

        <p class="profile-card__description">
          Second-year student who builds clean, accessible web pages and enjoys turning
          designs into working layouts.
        </p>

        <ul class="profile-card__skills" aria-label="Skills">
          <li class="skill-tag">HTML</li>
          <li class="skill-tag">CSS</li>
          <li class="skill-tag">JavaScript</li>
          <li class="skill-tag">Git</li>
        </ul>

        <a class="profile-card__button" href="mailto:riya@example.com">Contact me</a>
      </div>
    </article>
  </main>
</body>
</html>
